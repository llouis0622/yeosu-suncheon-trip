/* Responsive workspace: one focused pane on compact screens, parallel panes on desktop. */
html{height:100%;height:100dvh}
body{height:100%;height:var(--visible-height,100dvh)}
.main{grid-template-rows:44px 44px minmax(260px,1fr) auto;overflow:auto;overscroll-behavior:contain}
.main.national{grid-template-rows:44px minmax(220px,1fr)}
.map-and-candidates{min-width:0}
.planner:not(.expanded) .planner-body{max-height:clamp(140px,24dvh,240px)}
.planner-top,.planner-days,.planner-foot{min-width:0}
.planner-top{flex-wrap:wrap;gap:6px 12px;padding:5px 0}
.planner-view-buttons{flex-shrink:0;margin-left:0}
.planner-view-buttons button,.planner-tools button,.day-buttons button,.timeline-actions button,.category-tabs button{min-height:44px}
.planner-tools button{width:44px;flex-shrink:0}
.planner-tools .planner-more{display:none}
.planner-menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.planner-menu button{justify-content:flex-start;padding:12px;min-height:52px;overflow-wrap:anywhere}
.planner-days{padding:5px 0;gap:8px}
.day-buttons{scroll-padding-inline:8px}
.day-buttons button{scroll-margin-inline:8px}
.planner-foot{flex-wrap:wrap;gap:4px 12px;padding:3px 0}
.timeline-zoom button{min-width:40px;min-height:40px}
.planner-health{min-height:40px}
.candidate-list{scroll-padding-block:12px}
.candidate-description{font-size:14px;line-height:1.75}
.candidate-meta,.candidate-bath,.candidate-actions button{font-size:12px}
.category-tabs button{font-size:12px}
.search input{font-size:16px;min-height:44px}
.candidate-info select{min-height:44px}
.stop-card{flex-basis:304px}
.stop-card-top{height:44px}
.drag-handle,.stop-delete,.stop-order button,.mini-stepper button{min-width:44px;min-height:44px}
.stop-card-foot button{min-height:44px;font-size:12px}
.stop-main strong{font-size:15px}
.stop-main>span,.mini-stepper>span{font-size:12px}
.stop-controls{gap:6px}
.stop-order{gap:0;flex-shrink:0}
.stop-card-foot{flex-wrap:wrap;gap:0 6px}
.sequence-list.vertical .stop-card{min-width:0}
.duration-field{display:flex;flex-direction:column;gap:7px;min-width:0}
.edit-fields .duration-field>label{font-size:12px;color:#c3c4cb}
/* Native modal focus trapping + a single flexible scroll body keep close controls visible. */
.dialog[open]{display:flex;flex-direction:column;position:fixed;inset:0;top:var(--viewport-top,0px);bottom:auto;margin:12px auto;max-height:calc(var(--visible-height,100dvh) - 24px);max-width:calc(100% - 24px)}
.dialog-head{flex:none;min-width:0}
.dialog-head h2{overflow-wrap:anywhere}
.dialog-body{min-height:0;max-height:none;flex:1 1 auto;scroll-padding-block:18px;padding-bottom:max(22px,env(safe-area-inset-bottom))}
.dialog-body input,.dialog-body select{scroll-margin-block:20px}
.edit-actions{gap:8px}
.edit-actions button{flex:1 1 130px}
.detail-facts{flex-wrap:wrap;gap:16px 30px}
.picker-place b,.picker-place small,.picker-place p{overflow-wrap:anywhere}
.picker-place{align-items:flex-start}
.picker-place button{position:sticky;top:0}
.toast{bottom:max(12px,env(safe-area-inset-bottom));font-size:13px}
.toast button{min-height:44px}
@media(min-width:1700px){

}
