<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>여수·순천 고정 일정 검증</title>
<style>body{background:#18191b;color:#eee;font:14px system-ui;margin:12px}button,select{padding:9px;margin:3px;background:#303238;color:#fff;border:1px solid #666}iframe{display:block;border:0;max-width:none;margin-top:12px}pre{white-space:pre-wrap;font:12px monospace;max-height:280px;overflow:auto;background:#222;padding:12px}#status{margin:10px;font-weight:600}.toolbar{position:sticky;top:0;background:#18191b;z-index:5}</style>
<div class="toolbar"><button id="run">전체 화면·동작 검사</button><select id="size" aria-label="검사 화면 크기"></select><button id="open">선택 크기 미리보기</button><span id="status" role="status">준비</span></div><pre id="output"></pre><iframe id="frame" title="여행 페이지 테스트"></iframe>
<script>
const sizes=[[320,568],[360,800],[390,844],[430,932],[568,320],[844,390],[600,600],[600,800],[800,600],[768,1024],[1024,768],[820,1180],[1180,820],[1024,1366],[1366,1024],[1024,700],[1280,720],[1440,900],[1920,1080]];
const frame=document.querySelector('#frame'),output=document.querySelector('#output'),status=document.querySelector('#status'),key='yeosu-suncheon-fixed-test';
document.querySelector('#size').innerHTML=sizes.map(([w,h])=>`<option>${w} × ${h}</option>`).join('');
let checks=0,failures=0,errors=[],sizeLabel='';
const tick=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
const log=(value,name)=>{checks++;if(!value){failures++;output.textContent+=`FAIL ${sizeLabel}: ${name}\n`;}};
const click=(d,s)=>{const el=d.querySelector(s);if(!el)throw Error('missing '+s);el.click();};
const rect=(d,s)=>d.querySelector(s).getBoundingClientRect();
const phone=(w,h)=>w<600||(w<1200&&h<600)||(w<760&&h<760);
const selected=d=>[...d.querySelectorAll('[data-slot-value]')].map(e=>[e.dataset.block,e.dataset.slotValue]);
const route=(d,a,b)=>!!d.querySelector(`[data-route-from="${a}"][data-route-to="${b}"]`);
const ratios=d=>d.querySelector('#main').dataset.paneSizes.split(',').map(Number);
const near=(a,b)=>Math.abs(a-b)<.003;
function change(d,s,v){const el=d.querySelector(s);el.value=v;el.dispatchEvent(new d.defaultView.Event('change',{bubbles:true}));}
function keypress(d,s,key,shift=false){d.querySelector(s).dispatchEvent(new d.defaultView.KeyboardEvent('keydown',{key,shiftKey:shift,bubbles:true,cancelable:true}));}
async function load(w,h,clear=true){
 if(clear)localStorage.removeItem(key);sizeLabel=w+'×'+h;frame.width=w;frame.height=h;
 await new Promise((resolve,reject)=>{frame.onload=resolve;frame.onerror=reject;frame.src='./index.html?trip-test=1&qa='+Date.now();});
 const d=frame.contentDocument;
 d.defaultView.addEventListener('error',e=>errors.push(e.message));
 d.defaultView.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
 await tick();return d;
}
function startDivider(d,index,type='touch'){
 const el=d.querySelectorAll('.pane-divider')[index],r=el.getBoundingClientRect(),rows=d.querySelector('#main').dataset.layout==='rows',win=d.defaultView;
 const origin={clientX:r.x+r.width/2,clientY:r.y+r.height/2};let pos={...origin};
 const send=(target,name)=>target.dispatchEvent(new win.PointerEvent(name,{pointerId:44,pointerType:type,isPrimary:true,button:0,buttons:name==='pointerup'?0:1,...pos,bubbles:true,cancelable:true}));
 send(el,'pointerdown');return {move(delta){pos[rows?'clientY':'clientX']=origin[rows?'clientY':'clientX']+delta;send(win,'pointermove');},end(cancel=false){send(win,cancel?'pointercancel':'pointerup');}};
}
async function layoutSuite(w,h){
 let d=await load(w,h);const isPhone=phone(w,h),rows=!isPhone&&h>=w;
 log(d.querySelectorAll('[data-pin]').length===65,'all candidates + 2 neighborhood origin pins exist');
 log([...d.querySelectorAll('[data-pin]:not([data-type=origin])')].every(p=>!p.hidden),'initial map fits every candidate even in portrait rows');
 log(!d.querySelector('[data-course]')&&!d.querySelector('[data-time-part]'),'course selector and timeline editing removed');
 const header=rect(d,'#appHeader'),map=rect(d,'.map-frame'),places=rect(d,'#candidatePanel'),schedule=rect(d,'#planner');
 log(header.height<=50,'compact header');
 log(rect(d,'.view-switch').right<=w,'header tabs fit');
 log(d.documentElement.scrollWidth<=w+1&&d.documentElement.scrollHeight<=h+1,'no page overflow');
 if(isPhone){
  log(map.width>0&&places.width===0&&schedule.width===0,'phone starts on map tab');
  log([...d.querySelectorAll('.pane-divider')].every(e=>e.getBoundingClientRect().width===0),'no phone dividers');
 }else{
  const dimension=rows?'height':'width';
  log(near(map[dimension]/places[dimension],2)&&near(schedule[dimension]/places[dimension],1),'50 / 25 / 25 default proportions');
  log(rows?map.bottom<=places.top&&places.bottom<=schedule.top:map.right<=places.left&&places.right<=schedule.left,'non-overlapping panes in expected orientation');
  log(d.querySelector('#main').dataset.layout===(rows?'rows':'columns'),'responsive layout axis');
  const old=ratios(d),drag=startDivider(d,0);drag.move(24);const live=ratios(d);
  log(live[0]>old[0]&&live[1]<old[1]&&near(live[2],old[2]),'first divider resizes adjacent panes');drag.end();
  const second=startDivider(d,1,'mouse');second.move(-15);log(ratios(d)[1]<live[1]&&near(ratios(d)[0],live[0]),'second divider leaves map unchanged');second.end(true);
  log(ratios(d).every((v,i)=>near(v,live[i])),'cancel restores divider sizes');
  const extreme=startDivider(d,1);extreme.move(10000);extreme.end();
  const minSchedule=rect(d,'#planner');
  log(d.documentElement.scrollWidth<=w+1,'extreme resizing does not overflow page');
  log([...d.querySelectorAll('.planner-top button')].every(el=>el.getBoundingClientRect().right<=minSchedule.right+1),'controls fit minimum schedule size');
  keypress(d,'#mapDivider','Home');log(ratios(d).every((v,i)=>near(v,[.5,.25,.25][i])),'Home resets panes');
  keypress(d,'#mapDivider',rows?'ArrowUp':'ArrowLeft');log(near(ratios(d)[0],.45),'keyboard resizes by five percent');
  d=await load(w,h,false);log(ratios(d).every((v,i)=>near(v,[.5,.25,.25][i])),'reload resets 50 / 25 / 25');
 }
 click(d,'#pane-schedule');
 log(rect(d,'#planner').width<=w&&rect(d,'#scheduleScroll').height>=80,'schedule tab remains usable');
 log(d.querySelector('[data-block="d0-lunch"]').dataset.slotValue==='','initial meal is unselected');
 click(d,'[data-slot="d0-lunch"]');
 log(d.querySelector('#activeSlot').value==='d0-lunch','meal click selects matching candidate tab');
 log([...d.querySelectorAll('[data-card]')].every(e=>e.textContent.includes('순천')),'lunch list contains Suncheon choices');
 log(d.querySelectorAll('[data-pin]').length===65,'list filters do not remove map candidates');
 click(d,'[data-use="sc_nanulteo"]');
 log(route(d,'sc_tteok','sc_nanulteo')&&route(d,'sc_nanulteo','sc_garden')&&!route(d,'sc_tteok','sc_garden'),'choice inserts restaurant into route');
 click(d,'#pane-schedule');
 const lunch=d.querySelector('[data-block="d0-lunch"]');
 log(lunch.dataset.slotValue==='sc_nanulteo'&&Number(lunch.dataset.end)-Number(lunch.dataset.start)===90,'selected lunch retains ninety minutes');
 click(d,'[data-action="undo"]');log(route(d,'sc_tteok','sc_garden'),'undo restores direct route');
 click(d,'[data-action="redo"]');log(route(d,'sc_tteok','sc_nanulteo'),'redo restores selection');
 click(d,'[data-slot="d0-lunch"]');click(d,'[data-use="sc_gunbong"]');
 log(route(d,'sc_tteok','sc_gunbong')&&!route(d,'sc_tteok','sc_nanulteo'),'replacement removes previous restaurant route');
 click(d,'#pane-schedule');click(d,'[data-clear-slot="d0-lunch"]');
 log(route(d,'sc_tteok','sc_garden'),'clear removes detour');
 // Default 24-hour view is read-only and always fits its available width.
 click(d,'[data-view="timeline"]');
 log(!!d.querySelector('.time-block')&&!d.querySelector('[data-time-part]'),'24-hour chart is read-only');
 log(d.documentElement.scrollWidth<=w+1,'24-hour chart has no page overflow');
 click(d,'[data-view="sequence"]');
 click(d,'#pane-places');change(d,'#activeSlot','hotel');click(d,'[data-use="ys_stay_sono"]');
 log(d.querySelector('[data-pin="ys_stay_sono"]').classList.contains('layer-selected'),'hotel selection updates map');
 log(![...d.querySelectorAll('[data-route-to]')].some(e=>e.dataset.routeTo==='ys_stay_shilla'),'old hotel removed from every route');
 click(d,'#pane-schedule');click(d,'#planner [data-day="2"]');
 click(d,'[data-slot="d2-break"]');click(d,'[data-use="ys_goso"]');
 log(route(d,'ys_odongdo','ys_goso'),'optional mural village in day three route');
 click(d,'#pane-schedule');click(d,'[data-slot="d2-break"]');click(d,'[data-use="ys_moifin"]');
 log(route(d,'ys_odongdo','ys_moifin')&&!route(d,'ys_odongdo','ys_goso'),'cafe replaces mural village');
 d=await load(w,h,false);click(d,'#pane-schedule');click(d,'#planner [data-day="2"]');
 log(d.querySelector('[data-block="d2-break"]').dataset.slotValue==='ys_moifin'&&d.querySelector('[data-pin="ys_stay_sono"]').classList.contains('layer-selected'),'reload retains cafe and hotel choices');
 click(d,'[data-action="schedule-info"]');const dialog=rect(d,'#dialog');
 log(dialog.width<=w&&dialog.height<=h,'warning dialog fits viewport');
 log(d.querySelector('#dialogBody').textContent.includes('13:30'),'late-return warning is visible');click(d,'#closeDialog');
 click(d,'#pane-places');change(d,'#activeSlot','');click(d,'[data-category="hotel"]');click(d,'[data-detail="ys_stay_sono"]');
 log(d.querySelector('#detailBody').textContent.includes('욕조'),'room detail includes bath conditions');
 const detail=rect(d,'#detail');log(detail.width<=w&&detail.height<=h,'place detail fits viewport');click(d,'#closeDetail');
 click(d,'#pane-map');click(d,'#mapPlay');await tick();
 log(d.querySelector('#mapPlay').getAttribute('aria-pressed')==='true'&&!d.querySelector('#playCaption').hidden,'route animation starts');
 click(d,'#mapPlay');log(d.querySelector('#mapPlay').getAttribute('aria-pressed')==='false','animation pauses');
 click(d,'#arrivalReplay');log(!d.querySelector('#skipArrival').hidden&&d.querySelector('#playCaption').textContent.includes('대연동'),'Busan departure playback retained');
 click(d,'#skipArrival');
 output.textContent+=`PASS completed ${w} × ${h}\n`;
}
async function rotationSuite(w,h){
 let d=await load(w,h);click(d,'#planner [data-day="1"]');
 const drag=startDivider(d,0);drag.move(20);drag.end();const before=ratios(d);
 frame.width=h;frame.height=w;await tick();await tick();
 log(d.querySelector('#main').dataset.layout==='columns'&&d.querySelector('#main').dataset.pane==='split','tablet rotation uses columns');
 log(d.querySelector('#planner [data-day="1"]').getAttribute('aria-pressed')==='true','rotation retains day');
 log(ratios(d).every((v,i)=>near(v,[.5,.25,.25][i])),'independent landscape default sizes');
 frame.width=w;frame.height=h;await tick();await tick();
 log(d.querySelector('#main').dataset.layout==='rows'&&ratios(d).every((v,i)=>near(v,before[i])),'rotation back restores in-session portrait proportions');
}
async function sharingSuite(){
 const d=await load(1280,800);click(d,'[data-slot="d0-lunch"]');click(d,'[data-use="sc_nanulteo"]');
 const current=localStorage.getItem(key),encoded=btoa(unescape(encodeURIComponent(current))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
 localStorage.removeItem(key);
 await new Promise(resolve=>{frame.onload=resolve;frame.src='./index.html?trip-test=1&qa=share#plan='+encoded;});await tick();
 const doc=frame.contentDocument;log(route(doc,'sc_tteok','sc_nanulteo'),'shared selection URL restores detour');
 log(!doc.location.hash,'shared URL is consumed after import');
}
document.querySelector('#open').onclick=async()=>{const[w,h]=document.querySelector('#size').value.split(' × ').map(Number);await load(w,h);status.textContent=w+' × '+h;};
document.querySelector('#run').onclick=async()=>{
 const button=document.querySelector('#run');button.disabled=true;checks=failures=0;errors=[];output.textContent='Real Chromium layout; synthetic pointer/keyboard events. Physical devices are not covered.\n';
 try{for(const[w,h]of sizes){status.textContent=w+' × '+h+' 검사 중';await layoutSuite(w,h);}for(const[w,h]of [[768,1024],[820,1180],[1024,1366]])await rotationSuite(w,h);await sharingSuite();log(errors.length===0,'no application errors: '+errors.join('; '));}
 catch(e){failures++;output.textContent+='ERROR '+e.stack+'\n';}
 finally{button.disabled=false;status.textContent=checks+' checks · '+failures+' failures';output.dataset.checks=checks;output.dataset.failures=failures;localStorage.removeItem(key);}
};
document.querySelector('#open').click();
</script></html>
